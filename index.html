<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wesecure - AI Security Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
        /* A deep, dark navy-blue background that fits the security/tech theme */
        background-color: #0a0e1a;
        /* Subtle gradients to add depth and visual interest without being distracting */
        background-image: radial-gradient(circle at 10% 10%, rgba(17, 94, 89, 0.2) 0%, transparent 45%),
                          radial-gradient(circle at 90% 85%, rgba(74, 20, 140, 0.2) 0%, transparent 45%);
        color: #e5e7eb; /* A slightly softer white than pure white */
      }
      @keyframes fadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      .animate-fadeOut {
        /* Start animation after 2.5s, duration 0.5s, stays faded out */
        animation: fadeOut 0.5s ease-out 2.5s forwards;
      }
       @keyframes pulse-glow {
        0%, 100% {
          box-shadow: inset 0 1px 2px 0 rgba(255, 255, 255, 0.15), 0 0 10px rgba(99, 102, 241, 0.4), 0 0 20px rgba(139, 92, 246, 0.3);
        }
        50% {
          box-shadow: inset 0 1px 2px 0 rgba(255, 255, 255, 0.15), 0 0 30px rgba(99, 102, 241, 0.8), 0 0 60px rgba(139, 92, 246, 0.6);
        }
      }
      @keyframes pulse-bg {
        0%, 100% {
          background-color: rgba(55, 65, 81, 0.3); /* gray-700/30 */
        }
        50% {
          background-color: rgba(75, 85, 99, 0.3); /* gray-600/30 */
        }
      }
      .animate-pulse-bg {
        animation: pulse-bg 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes ripple-effect {
        to {
          transform: scale(4);
          opacity: 0;
        }
      }
      .ripple {
        position: absolute;
        border-radius: 50%;
        transform: scale(0);
        animation: ripple-effect 600ms linear;
        background-color: rgba(255, 255, 255, 0.4);
      }
      @keyframes pulse-subtle {
        0%, 100% {
          filter: drop-shadow(0 0 3px rgba(99, 102, 241, 0.4));
        }
        50% {
          filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.7));
        }
      }
      @keyframes glow-faint {
        0%, 100% {
          box-shadow: 0 0 5px rgba(45, 212, 191, 0.1), 0 0 10px rgba(59, 130, 246, 0.1);
          border-color: rgba(107, 114, 128, 0.3);
        }
        50% {
          box-shadow: 0 0 15px rgba(45, 212, 191, 0.25), 0 0 25px rgba(59, 130, 246, 0.2);
          border-color: rgba(107, 114, 128, 0.5);
        }
      }

      /* --- Hero Visual Animations --- */
       .hero-text-glow {
        position: absolute;
        top: 45%;
        left: 50%;
        width: 32rem; /* 512px */
        height: 10rem; /* 160px */
        background: radial-gradient(ellipse at center, rgba(139, 92, 246, 0.20), transparent 70%);
        filter: blur(40px);
        transform: translate(-50%, -50%);
        z-index: 5;
      }

      @keyframes pan-grid {
        0% { background-position: 0% 0%; }
        100% { background-position: 200% 200%; }
      }
      .bg-grid-pattern {
        background-image:
          linear-gradient(rgba(100, 116, 139, 0.1) 1px, transparent 1px),
          linear-gradient(to right, rgba(100, 116, 139, 0.1) 1px, transparent 1px);
        background-size: 3rem 3rem;
      }
      .animate-pan-grid {
        animation: pan-grid 120s linear infinite;
      }

      .purple-halo {
        background: radial-gradient(ellipse at center, rgba(139, 92, 246, 0.15) 0%, transparent 60%);
      }

      @keyframes scan-ring-rotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .scanning-ring {
        width: 32rem; /* 512px */
        height: 32rem;
        border-radius: 50%;
        position: absolute;
        background: conic-gradient(
          from 180deg at 50% 50%,
          rgba(79, 209, 209, 0) 0%,
          rgba(79, 209, 209, 0.3) 15%,
          rgba(79, 209, 209, 0) 30%,
          transparent 100%
        );
        filter: blur(32px);
        animation: scan-ring-rotate 10s linear infinite;
        opacity: 0.6;
      }

      @keyframes move-particles {
        0% {
          transform: translateY(20px);
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          transform: translateY(-20px);
          opacity: 0;
        }
      }
      .animate-move-particles {
        animation-name: move-particles;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }

      @keyframes spin-radar {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin-radar {
        animation: spin-radar 4s linear infinite;
      }

      @keyframes pulse-ring {
        0% {
          transform: scale(0.85);
          opacity: 0.1;
        }
        50% {
          opacity: 0.4;
        }
        100% {
          transform: scale(1.1);
          opacity: 0;
        }
      }
      .animate-pulse-ring {
        animation: pulse-ring 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes pulse-shield-center {
        0%, 100% {
          filter: drop-shadow(0 0 10px rgba(77, 160, 255, 0.3));
          transform: scale(1);
        }
        50% {
          filter: drop-shadow(0 0 25px rgba(77, 160, 255, 0.6));
          transform: scale(1.02);
        }
      }
      .animate-pulse-shield-center {
        animation: pulse-shield-center 5s ease-in-out infinite;
      }
      .shield-backdrop-glow {
        position: absolute;
        width: 250px;
        height: 250px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, transparent 70%);
        filter: blur(30px);
      }
      
      /* --- UI Polish --- */
      .text-glow {
        text-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
      }
      .header-glow {
        position: relative;
      }
      .header-glow::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 300px;
        height: 100%;
        background: radial-gradient(circle at 0% 50%, rgba(79, 70, 229, 0.15), transparent 80%);
        pointer-events: none;
        z-index: -1;
      }
      .header-border {
        border-bottom-width: 1px;
        border-image-slice: 1;
        border-image-source: linear-gradient(to right, rgba(139, 92, 246, 0.2), rgba(99, 102, 241, 0.3), rgba(139, 92, 246, 0.2));
      }
      .scan-card-glow {
        position: relative;
        z-index: 1;
        
        /* Darker, less saturated, more transparent glass background */
        background-color: rgba(17, 24, 39, 0.3);
        background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.00) 100%);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        
        /* Subtler drop shadow and inner-highlight */
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 25px 40px rgba(5, 0, 15, 0.12);
        
        border: 1px solid transparent;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .scan-card-glow::before {
        content: "";
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        z-index: -1;
        margin: -1px;
        border-radius: inherit;
        /* Faint gradient border with ~8% opacity */
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.08) 0%, rgba(139, 92, 246, 0.08) 100%);
      }
      .scan-card-glow:hover {
        transform: translateY(-2px);
        /* Slightly more prominent but still soft shadow on hover */
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 30px 50px rgba(5, 0, 15, 0.15);
      }
      
      .input-cyber {
        position: relative;
        background-color: #111827;
        border: 1px solid transparent;
        border-radius: 0.375rem;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        transition: all 0.3s ease-in-out;
      }
      .input-cyber::after {
          content: '';
          position: absolute;
          top: -1px; left: -1px; right: -1px; bottom: -1px;
          background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.2));
          border-radius: inherit;
          z-index: -1;
          transition: background 0.3s ease-in-out;
      }
      .input-cyber:focus-within {
        box-shadow: 0 0 15px rgba(99, 102, 241, 0.3), inset 0 2px 4px rgba(0,0,0,0.5);
      }
      .input-cyber:focus-within::after {
          background: linear-gradient(135deg, rgba(99, 102, 241, 0.5), rgba(139, 92, 246, 0.5));
      }
      
      .footer-icon-active-glow {
        filter: drop-shadow(0 0 8px rgba(96, 165, 250, 0.7));
      }

      .btn-start-scan::before {
        content: '';
        position: absolute;
        top: 2px;
        left: 15%;
        right: 15%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
        border-radius: 50%;
        filter: blur(3px);
        opacity: 0.8;
        transition: opacity 0.3s ease;
      }
      .btn-start-scan:hover::before {
        opacity: 1;
      }

      .error-box-cyber {
        background-color: rgba(255, 80, 105, 0.18);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 120, 140, 0.35);
        border-radius: 1rem;
        color: #FF9AA6;
        box-shadow: inset 0 0 12px rgba(255, 90, 120, 0.25), 0 0 18px rgba(255, 70, 100, 0.18);
        padding: 0.75rem 1rem;
        font-size: 0.875rem;
      }

      /* --- Report Page Styles --- */
      @keyframes slide-fade-in {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .animate-slide-fade-in {
        animation: slide-fade-in 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        opacity: 0; /* Initially hidden */
      }

      @keyframes pulse-badge-high {
        0%, 100% {
          box-shadow: 0 0 12px rgba(255, 74, 74, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.2);
          transform: scale(1);
        }
        50% {
          box-shadow: 0 0 20px rgba(255, 74, 74, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.2);
          transform: scale(1.03);
        }
      }
      
      .report-top-gradient {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 300px;
        background: radial-gradient(ellipse at top center, rgba(139, 92, 246, 0.15), transparent 70%);
        pointer-events: none;
        z-index: -1;
      }

      .report-card-glass {
        background: rgba(17, 24, 39, 0.4);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.07);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05), 0 25px 50px rgba(0,0,0,0.3);
        position: relative;
        overflow: hidden;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .report-card-glass-primary {
        background: rgba(24, 32, 52, 0.5);
        border-color: rgba(255, 255, 255, 0.1);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.08), 0 25px 50px rgba(0,0,0,0.3);
      }
      
      /* Upgraded Score Gauge */
      .score-gauge-container {
        position: relative;
        width: 200px;
        height: 200px;
        filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
      }
      .score-gauge-svg {
        transform: rotate(-90deg);
      }
      .score-gauge-bg {
        fill: none;
        stroke: rgba(255, 255, 255, 0.08);
        stroke-width: 12;
      }
      .score-gauge-fg {
        fill: none;
        stroke-width: 12;
        stroke-linecap: round;
        transition: stroke-dashoffset 1.2s cubic-bezier(0.45, 0, 0.55, 1);
      }
      .score-gauge-glow {
        position: absolute;
        inset: -25px;
        border-radius: 50%;
        animation-duration: 3s;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
        filter: blur(70px);
        z-index: -1;
      }
      .score-gauge-reflection {
        content: '';
        position: absolute;
        top: 5px;
        left: 10%;
        right: 10%;
        height: 50%;
        border-radius: 50%;
        background: linear-gradient(to bottom, rgba(255,255,255,0.08) 0%, transparent 100%);
        pointer-events: none;
      }
      .score-gauge-inner-shadow {
        content: '';
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
      }

      .score-glow-red { background: rgba(255, 60, 60, 0.2); }
      .score-glow-yellow { background: rgba(245, 158, 11, 0.2); }
      .score-glow-blue { background: rgba(59, 130, 246, 0.2); }
      .score-glow-green { background: rgba(74, 222, 128, 0.2); }

      /* Upgraded Severity Tags */
      .severity-tag {
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
        border: 1px solid transparent;
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 3px 8px rgba(0,0,0,0.4);
        color: white;
        text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        transition: all 0.3s ease;
      }
      .severity-tag-high {
        background: linear-gradient(180deg, #FF4A4A, #C73A3A);
        border-color: rgba(255, 100, 100, 0.5);
        animation: pulse-badge-high 2.5s infinite ease-in-out;
      }
      .severity-tag-medium {
        background: linear-gradient(180deg, #F59E0B, #B45309);
        border-color: rgba(245, 158, 11, 0.5);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 0 12px rgba(245, 158, 11, 0.4);
      }
      .severity-tag-low {
        background: linear-gradient(180deg, #3B82F6, #1D4ED8);
        border-color: rgba(59, 130, 246, 0.5);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 0 12px rgba(59, 130, 246, 0.4);
      }
      .severity-tag-informational {
        background: linear-gradient(180deg, #14B8A6, #0F766E);
        border-color: rgba(20, 184, 166, 0.5);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1), 0 0 12px rgba(20, 184, 166, 0.3);
      }
      .severity-tag-pass {
        background: linear-gradient(180deg, #22C55E, #15803D);
        border-color: rgba(34, 197, 94, 0.5);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 0 12px rgba(34, 197, 94, 0.4);
      }
      .severity-tag-default {
        background-color: rgba(107, 114, 128, 0.2);
        border-color: rgba(107, 114, 128, 0.4);
        color: #d1d5db; /* gray-300 */
      }
      
      .icon-color-high { color: #f87171; } /* red-400 */
      .icon-color-medium { color: #fb923c; } /* orange-400 */
      .icon-color-low { color: #60a5fa; } /* blue-400 */
      .icon-color-informational { color: #2dd4bf; } /* teal-400 */
      .icon-color-pass { color: #4ade80; } /* green-400 */
      .icon-color-default { color: #9ca3af; } /* gray-400 */

      /* Accordion */
      .accordion-content {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.5s ease-out;
        overflow: hidden;
      }
      .accordion-content > div {
        min-height: 0;
      }
      .accordion-content.open {
        grid-template-rows: 1fr;
      }

      /* Section Header Anchor */
      .section-header-anchor {
        position: relative;
        padding-bottom: 0.75rem; /* 12px */
        margin-bottom: 1.5rem; /* 24px */
      }
      .section-header-anchor::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(to right, rgba(139, 92, 246, 0.0), rgba(139, 92, 246, 0.2), rgba(139, 92, 246, 0.0));
      }

      /* Report Hero Shield Glow */
      .report-hero-shield-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 120px;
        height: 120px;
        background: radial-gradient(circle, rgba(60, 120, 255, 0.15) 0%, transparent 70%);
        filter: blur(20px);
        z-index: -1;
      }

      /* Findings / Recommendation Blocks */
      .detail-block {
        padding-left: 0.75rem; /* 12px */
        border-left: 2px solid rgba(255, 255, 255, 0.1);
      }
      
      /* --- Dashboard Enhancements --- */
      .history-card-glow {
        position: relative;
        z-index: 1;
        /* Glass highlight */
        background-color: rgba(17, 24, 39, 0.4);
        background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.00) 100%);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        /* Deeper shadow */
        box-shadow: 0 25px 40px rgba(5, 0, 15, 0.15);
        border: 1px solid transparent;
        transition: box-shadow 0.3s ease;
      }
      .history-card-glow::before {
        content: "";
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        z-index: -1;
        margin: -1px;
        border-radius: inherit;
        /* Neon edge */
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.08) 0%, rgba(139, 92, 246, 0.08) 100%);
        transition: background 0.3s ease;
      }
      .history-card-glow:hover {
        box-shadow: 0 30px 50px rgba(5, 0, 15, 0.2);
      }
      .history-card-glow:hover::before {
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(139, 92, 246, 0.15) 100%);
      }
      .history-header-icon-glow {
        filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.6));
      }
      .history-row {
        transition: transform 0.2s ease-out, background-color 0.2s ease-out, box-shadow 0.2s ease-out, border-color 0.2s ease-out;
        border-bottom: 1px solid rgb(55 65 81 / 0.5); /* gray-700/50 */
      }
      .history-row:last-child {
        border-bottom: none;
      }
      .history-row:hover {
        transform: translateY(-2px);
        background-color: rgba(99, 102, 241, 0.1);
        box-shadow: 0 0 25px rgba(99, 102, 241, 0.1), inset 0 0 10px rgba(99, 102, 241, 0.05);
        border-bottom-color: rgba(99, 102, 241, 0.2);
      }
      .history-row-arrow {
        opacity: 0.3;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }
      .history-row:hover .history-row-arrow {
        opacity: 1;
        filter: drop-shadow(0 0 5px rgba(99, 102, 241, 0.7));
      }
      .history-row:active .history-row-arrow {
        transform: translateX(2px) rotate(45deg);
      }

      /* --- Scanning Button Enhancements --- */
      @keyframes breathing-gradient {
        0%, 100% {
          background-position: 0% 50%;
          box-shadow: 0 0 25px rgba(108, 71, 255, 0.4), 0 0 50px rgba(134, 107, 255, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }
        50% {
          background-position: 100% 50%;
          box-shadow: 0 0 35px rgba(108, 71, 255, 0.6), 0 0 70px rgba(76, 50, 255, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes text-fade-glow {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.9; }
      }
      .scanning-text {
        animation: text-fade-glow 1s linear infinite;
      }
      .btn-scanning, .btn-scanning:disabled {
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, #4C32FF, #866BFF, #6C47FF, #4C32FF);
        background-size: 300% 300%;
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.4), 0 0 40px rgba(139, 92, 246, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        cursor: wait;
        animation: breathing-gradient 1.8s ease-in-out infinite;
      }
      .btn-scanning::before {
        content: '';
        position: absolute;
        inset: -100%;
        background: radial-gradient(circle, rgba(134, 107, 255, 0.08) 30%, transparent 60%);
        filter: blur(60px);
        z-index: 0;
        animation: scanning-radar-pulse 2.4s ease-out infinite;
      }
      .btn-scanning::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        height: 2px;
        width: 100%;
        background: linear-gradient(90deg, transparent, rgba(134, 107, 255, 0.15), rgba(99, 102, 241, 0.15), transparent);
        animation: micro-progress 1.5s linear infinite;
      }
      .btn-scanning > * {
        position: relative;
        z-index: 1;
      }
      @keyframes scanning-radar-pulse {
        0% { transform: scale(0.6); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: scale(1.3); opacity: 0; }
      }
      @keyframes micro-progress {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      /* --- Scanning Hero Visual Enhancements --- */
      .shield-container {
        position: relative;
        width: 7rem;
        height: 7rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .shield-container::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 10%;
        right: 10%;
        height: 2px;
        width: 80%;
        background: linear-gradient(to right, transparent, #63CAF1 50%, transparent);
        filter: drop-shadow(0 0 5px #63CAF1);
        opacity: 0;
      }
      .hero-scanning .shield-container::after {
        animation: shield-scan-line 3s ease-in-out infinite;
      }
      .hero-scanning .animate-pulse-shield-center {
        animation: hero-shield-pulse-scanning 2s ease-in-out infinite;
      }
      .hero-scanning .animate-spin-radar {

      /* Premium Cyber Toggle */

        box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
